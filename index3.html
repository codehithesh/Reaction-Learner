<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Reaction Evaluator</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1f2937;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --user-bubble: #1f6feb;
    --user-bubble-text: #ffffff;
    --ai-bubble: #21262d;
    --transcript-bubble: #2d3b4f;
    --error: #f85149;
    --success: #2ea043;
    --record: #d93025;
    --shadow: rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f8fa;
    --panel-2: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --text-dim: #656d76;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --user-bubble: #0969da;
    --user-bubble-text: #ffffff;
    --ai-bubble: #f6f8fa;
    --transcript-bubble: #eef2f7;
    --error: #cf222e;
    --success: #1a7f37;
    --record: #cf222e;
    --shadow: rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  .app {
    display: grid;
    grid-template-columns: 480px 1fr;
    height: 100vh;
  }
  .left-panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    overflow-y: auto;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
  }
  #theme-toggle {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #theme-toggle:hover { background: var(--border); }
  .video-section { display: flex; flex-direction: column; gap: 10px; }
  .video-wrap {
    position: relative;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }
  #video-overlay {
    position: absolute;
    color: #fff;
    font-size: 13px;
    text-align: center;
    pointer-events: none;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 4px;
  }
  #video-overlay.hidden { display: none; }
  .video-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #play-pause {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  #play-pause:hover:not(:disabled) { background: var(--accent-hover); }
  #play-pause:disabled { opacity: 0.4; cursor: not-allowed; }
  #time-display {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
    color: var(--text-dim);
  }
  #file-input {
    width: 100%;
    padding: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  #status-line {
    font-size: 12px;
    color: var(--text-dim);
    min-height: 18px;
    padding: 4px 0;
  }
  #status-line.error { color: var(--error); }
  #status-line.success { color: var(--success); }
  .api-section { display: flex; flex-direction: column; gap: 6px; }
  .api-section label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
  }
  #api-key {
    width: 100%;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  #api-key:focus { outline: none; border-color: var(--accent); }
  #api-error { font-size: 12px; color: var(--error); min-height: 14px; }

  .right-panel {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    height: 100vh;
  }
  .export-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .export-bar button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .export-bar button:hover:not(:disabled) {
    background: var(--border);
  }
  .export-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty-state {
    color: var(--text-dim);
    text-align: center;
    padding: 40px 20px;
    font-size: 14px;
  }
  .bubble {
    max-width: 88%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .bubble.transcript {
    background: var(--transcript-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    align-self: flex-start;
    border-top-left-radius: 4px;
    max-width: 95%;
  }
  .bubble.user {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    align-self: flex-end;
    border-top-right-radius: 4px;
  }
  .bubble.ai {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    align-self: flex-start;
    border-top-left-radius: 4px;
  }
  .bubble-header {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    opacity: 0.75;
  }
  .bubble-transcript-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-style: italic;
  }
  .bubble p { margin: 4px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code {
    background: rgba(0,0,0,0.2);
    padding: 1px 4px;
    border-radius: 3px;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 0.9em;
  }
  .bubble pre {
    background: rgba(0,0,0,0.2);
    padding: 8px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 6px 0;
  }
  .bubble ul, .bubble ol { padding-left: 22px; margin: 4px 0; }
  .bubble strong { font-weight: 600; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 8px 0 4px;
    font-size: 14px;
    font-weight: 600;
  }
  .bubble .timestamp-tag {
    display: inline-block;
    background: rgba(0,0,0,0.25);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 11px;
    margin-right: 4px;
  }
  .bubble.user .timestamp-tag {
    background: rgba(255,255,255,0.2);
  }
  .score-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 12px;
    margin-left: 6px;
  }
  .score-badge.high { background: rgba(46, 160, 67, 0.25); color: #2ea043; }
  .score-badge.mid { background: rgba(217, 119, 6, 0.25); color: #d97706; }
  .score-badge.low { background: rgba(248, 81, 73, 0.25); color: #f85149; }

  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    align-items: center;
  }
  #text-input {
    flex: 1;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  #text-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #record-btn {
    background: var(--panel-2);
    color: var(--record);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #record-btn:hover:not(:disabled) { background: var(--border); }
  #record-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #record-btn.recording {
    background: var(--record);
    color: #fff;
    border-color: var(--record);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .record-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--record);
    border-radius: 50%;
  }
  #record-btn.recording .record-dot { background: #fff; }
  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--text-dim);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bubble.loading::after {
    content: "";
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--text-dim);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Scrollbar */
  .chat::-webkit-scrollbar, .left-panel::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-track, .left-panel::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb, .left-panel::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  .chat::-webkit-scrollbar-thumb:hover, .left-panel::-webkit-scrollbar-thumb:hover {
    background: var(--text-dim);
  }
</style>
</head>
<body>
<div class="app">
  <aside class="left-panel">
    <div class="header">
      <h1>Video Reaction Evaluator</h1>
      <button id="theme-toggle" title="Toggle theme">🌙</button>
    </div>
    <div class="video-section">
      <div class="video-wrap">
        <video id="video" playsinline></video>
        <div id="video-overlay">No video loaded</div>
      </div>
      <div class="video-controls">
        <button id="play-pause" disabled>Play</button>
        <span id="time-display">00:00 / 00:00</span>
      </div>
      <input type="file" id="file-input" accept="video/*">
      <div id="status-line">Select a video to begin</div>
    </div>
    <div class="api-section">
      <label for="api-key">OpenAI API Key (BYOK)</label>
      <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
      <div id="api-error"></div>
    </div>
  </aside>
  <main class="right-panel">
    <div class="export-bar">
      <button id="export-json" disabled>Export JSON</button>
      <button id="export-md" disabled>Export Markdown</button>
    </div>
    <div id="chat" class="chat">
      <div class="empty-state">Transcript and reactions will appear here after you select a video and enter your OpenAI API key.</div>
    </div>
    <div class="input-area">
      <input type="text" id="text-input" placeholder="Type your reaction or record audio..." disabled>
      <button id="send-btn" disabled>Send</button>
      <button id="record-btn" disabled><span class="record-dot"></span>Record</button>
    </div>
  </main>
</div>

<script type="module">
import { marked } from 'https://esm.sh/marked@12.0.2';

// ============================================================
// State (in-memory only, no persistence)
// ============================================================
const state = {
  apiKey: '',
  videoName: '',
  videoDuration: 0,
  hasPlayed: false,           // video plays only once
  ffmpegReady: false,
  ffmpegLoading: false,
  transcriptSegments: [],     // [{start, end, text}]
  transcriptText: '',
  reactions: [],              // [{id, type: 'text'|'audio', text, timestamp, source}]
  evaluations: [],            // [{reactionId, ...scores, raw}]
  isRecording: false,
  mediaRecorder: null,
  audioChunks: [],
  isLoadingTranscript: false,
  isLoadingEval: false,
};

// ============================================================
// DOM
// ============================================================
const $ = id => document.getElementById(id);
const video = $('video');
const videoOverlay = $('video-overlay');
const playPauseBtn = $('play-pause');
const timeDisplay = $('time-display');
const fileInput = $('file-input');
const statusLine = $('status-line');
const apiKeyInput = $('api-key');
const apiError = $('api-error');
const chat = $('chat');
const textInput = $('text-input');
const sendBtn = $('send-btn');
const recordBtn = $('record-btn');
const exportJsonBtn = $('export-json');
const exportMdBtn = $('export-md');
const themeToggle = $('theme-toggle');

// ============================================================
// Helpers
// ============================================================
function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function setStatus(msg, kind) {
  statusLine.textContent = msg || '';
  statusLine.className = kind === 'error' ? 'error' : kind === 'success' ? 'success' : '';
}
function setApiError(msg) { apiError.textContent = msg || ''; }
function getApiKey() {
  const k = apiKeyInput.value.trim();
  if (!k) { setApiError('API key required'); return null; }
  setApiError('');
  return k;
}
function scrollChatBottom() { chat.scrollTop = chat.scrollHeight; }
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderMarkdown(text) {
  try { return marked.parse(text || '', { breaks: true }); }
  catch { return escapeHtml(text || ''); }
}

// ============================================================
// Theme toggle (no persistence — resets on refresh)
// ============================================================
themeToggle.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeToggle.textContent = next === 'dark' ? '🌙' : '☀';
});

// ============================================================
// Video handling — autoplay on select, play/pause only,
// no seeking, plays once then locks
// ============================================================
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  // Reset session
  state.transcriptSegments = [];
  state.transcriptText = '';
  state.reactions = [];
  state.evaluations = [];
  state.hasPlayed = false;
  state.videoName = file.name;
  video.src = URL.createObjectURL(file);
  videoOverlay.classList.add('hidden');
  playPauseBtn.disabled = false;
  playPauseBtn.textContent = 'Play';
  setStatus('Loading video...');
  // Clear chat
  chat.innerHTML = '<div class="empty-state">Loading transcript...</div>';
  exportJsonBtn.disabled = true;
  exportMdBtn.disabled = true;

  video.addEventListener('loadedmetadata', async () => {
    state.videoDuration = video.duration;
    timeDisplay.textContent = `00:00 / ${fmtTime(video.duration)}`;
    setStatus(`Video loaded: ${file.name} (${fmtTime(video.duration)})`, 'success');
    // Auto-play once
    try {
      await video.play();
      state.hasPlayed = true;
      playPauseBtn.textContent = 'Pause';
    } catch (err) {
      setStatus('Click Play to start (autoplay blocked)', 'error');
    }
    // Load ffmpeg.wasm lazily and transcribe
    await ensureFfmpegAndTranscribe(file);
  }, { once: true });
});

// Custom play/pause — no seek bar
playPauseBtn.addEventListener('click', async () => {
  if (video.ended) return; // locked, played once
  if (video.paused) {
    try { await video.play(); playPauseBtn.textContent = 'Pause'; }
    catch (e) { setStatus('Playback failed: ' + e.message, 'error'); }
  } else {
    video.pause();
    playPauseBtn.textContent = 'Play';
  }
});

// Block seeking — user cannot scrub
video.addEventListener('seeking', () => {
  // Prevent manual seeking via keyboard / dev tools
  // We don't have a seek bar (controls=false) but block programmatic seeks too
  // by ignoring — playback continues from current position
});

video.addEventListener('timeupdate', () => {
  if (video.duration) timeDisplay.textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
});

video.addEventListener('ended', () => {
  playPauseBtn.textContent = 'Replay Locked';
  playPauseBtn.disabled = true;
  setStatus('Video finished — playback locked (single play only)', 'success');
});

// Disable default video controls
video.controls = false;
video.disablePictureInPicture = true;
video.disableRemotePlayback = true;
// Block context menu on video (no right-click save/controls)
video.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// ffmpeg.wasm — lazy load on first video select
// Uses single-threaded core (no SharedArrayBuffer / COOP-COEP needed)
// Works on GitHub Pages
// ============================================================
let ffmpeg = null;
const FFMPEG_VERSION = '0.12.10';
const CORE_VERSION = '0.12.6';

async function ensureFfmpegAndTranscribe(file) {
  const key = getApiKey();
  if (!key) {
    setStatus('Enter OpenAI API key to transcribe', 'error');
    chat.innerHTML = '<div class="empty-state">Enter your OpenAI API key in the left panel to begin transcription.</div>';
    return;
  }

  // Load ffmpeg.wasm if not yet loaded
  if (!state.ffmpegReady) {
    if (state.ffmpegLoading) {
      setStatus('ffmpeg.wasm is loading, please wait...');
      return;
    }
    state.ffmpegLoading = true;
    setStatus('Loading ffmpeg.wasm core (~25MB, one-time)...');
    try {
      const { FFmpeg } = await import(`https://esm.sh/@ffmpeg/ffmpeg@${FFMPEG_VERSION}`);
      const { toBlobURL } = await import(`https://esm.sh/@ffmpeg/util@0.12.1`);
      ffmpeg = new FFmpeg();
      const baseURL = `https://unpkg.com/@ffmpeg/core@${CORE_VERSION}/dist/umd`;
      await ffmpeg.load({
        coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
      });
      state.ffmpegReady = true;
      state.ffmpegLoading = false;
      setStatus('ffmpeg.wasm ready', 'success');
    } catch (err) {
      state.ffmpegLoading = false;
      setStatus('ffmpeg.wasm load failed: ' + err.message, 'error');
      chat.innerHTML = `<div class="empty-state">Failed to load ffmpeg.wasm: ${escapeHtml(err.message)}<br>Check your network connection and try again.</div>`;
      return;
    }
  }

  // Extract + transcribe
  await extractAndTranscribe(file);
}

async function extractAndTranscribe(file) {
  state.isLoadingTranscript = true;
  chat.innerHTML = '<div class="empty-state"><span class="loader"></span> Extracting audio with ffmpeg.wasm...</div>';
  setStatus('Extracting audio (mono 16kHz WAV)...');
  try {
    // Write input file to ffmpeg FS
    const inExt = file.name.split('.').pop().toLowerCase();
    const inFile = `input.${inExt}`;
    const outFile = 'out.wav';
    await ffmpeg.writeFile(inFile, new Uint8Array(await file.arrayBuffer()));

    // Get duration via ffprobe-like approach: run ffmpeg with no output
    // We already have video.duration, use that for chunking
    const totalDuration = state.videoDuration;
    const CHUNK_SECONDS = 600; // 10 minutes per chunk
    const MAX_PAYLOAD_BYTES = 24 * 1024 * 1024; // 24MB safety under 25MB OpenAI limit

    // Estimate WAV size: 16000 Hz * 16-bit * mono = 32KB/s
    const estimatedBytes = totalDuration * 32000;
    let segments = [];
    if (estimatedBytes <= MAX_PAYLOAD_BYTES) {
      // Single extraction
      setStatus('Extracting audio (mono 16kHz WAV)...');
      await ffmpeg.exec(['-i', inFile, '-ac', '1', '-ar', '16000', '-f', 'wav', outFile]);
      const data = await ffmpeg.readFile(outFile);
      const blob = new Blob([data.buffer], { type: 'audio/wav' });
      segments.push({ start: 0, end: totalDuration, blob });
    } else {
      // Chunked extraction
      const numChunks = Math.ceil(totalDuration / CHUNK_SECONDS);
      setStatus(`Extracting audio in ${numChunks} chunks (mono 16kHz WAV)...`);
      for (let i = 0; i < numChunks; i++) {
        const startSec = i * CHUNK_SECONDS;
        const dur = Math.min(CHUNK_SECONDS, totalDuration - startSec);
        const chunkFile = `chunk_${i}.wav`;
        await ffmpeg.exec([
          '-i', inFile,
          '-ss', String(startSec),
          '-t', String(dur),
          '-ac', '1', '-ar', '16000', '-f', 'wav', chunkFile
        ]);
        const data = await ffmpeg.readFile(chunkFile);
        const blob = new Blob([data.buffer], { type: 'audio/wav' });
        segments.push({ start: startSec, end: startSec + dur, blob });
        try { await ffmpeg.deleteFile(chunkFile); } catch {}
        setStatus(`Extracted chunk ${i+1}/${numChunks}...`);
      }
    }

    // Clean up input file
    try { await ffmpeg.deleteFile(inFile); } catch {}
    try { await ffmpeg.deleteFile(outFile); } catch {}

    // Transcribe each chunk
    state.transcriptSegments = [];
    let fullText = '';
    for (let i = 0; i < segments.length; i++) {
      setStatus(`Transcribing chunk ${i+1}/${segments.length} via gpt-4o-transcribe...`);
      chat.innerHTML = `<div class="empty-state"><span class="loader"></span> Transcribing ${i+1}/${segments.length}...</div>`;
      const seg = segments[i];
      const result = await transcribeAudio(seg.blob, `chunk_${i}.wav`);
      if (result && result.segments) {
        for (const s of result.segments) {
          state.transcriptSegments.push({
            start: s.start + seg.start,
            end: s.end + seg.start,
            text: s.text.trim()
          });
          fullText += s.text.trim() + ' ';
        }
      } else if (result && result.text) {
        // Fallback: no segments
        state.transcriptSegments.push({
          start: seg.start,
          end: seg.end,
          text: result.text.trim()
        });
        fullText += result.text.trim() + ' ';
      }
    }
    state.transcriptText = fullText.trim();

    if (state.transcriptSegments.length === 0) {
      setStatus('Transcription returned no segments', 'error');
      chat.innerHTML = '<div class="empty-state">Transcription failed — no segments returned. Check your API key.</div>';
      state.isLoadingTranscript = false;
      return;
    }

    setStatus(`Transcript ready (${state.transcriptSegments.length} segments)`, 'success');
    renderTranscriptBubble();
    enableInputs();
    exportJsonBtn.disabled = false;
    exportMdBtn.disabled = false;
    state.isLoadingTranscript = false;
  } catch (err) {
    state.isLoadingTranscript = false;
    setStatus('Transcription failed: ' + (err.message || err), 'error');
    chat.innerHTML = `<div class="empty-state">Transcription failed: ${escapeHtml(err.message || String(err))}</div>`;
  }
}

// ============================================================
// OpenAI transcription — gpt-4o-transcribe with verbose_json
// ============================================================
async function transcribeAudio(blob, filename) {
  const key = getApiKey();
  if (!key) throw new Error('API key required');

  const form = new FormData();
  form.append('file', blob, filename || 'audio.wav');
  form.append('model', 'gpt-4o-transcribe');
  form.append('response_format', 'verbose_json');
  form.append('timestamp_granularities[]', 'segment');

  const resp = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${key}` },
    body: form,
  });

  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`OpenAI transcription ${resp.status}: ${errText}`);
  }
  return await resp.json();
}

// ============================================================
// Render transcript as first chat bubble (markdown with [mm:ss] tags)
// ============================================================
function renderTranscriptBubble() {
  // Remove empty state
  const empty = chat.querySelector('.empty-state');
  if (empty) empty.remove();

  // Remove existing transcript bubble if any
  const existing = chat.querySelector('.bubble.transcript');
  if (existing) existing.remove();

  const bubble = document.createElement('div');
  bubble.className = 'bubble transcript';

  const header = document.createElement('div');
  header.className = 'bubble-header';
  header.textContent = `Transcript — ${state.videoName}`;
  bubble.appendChild(header);

  const meta = document.createElement('div');
  meta.className = 'bubble-transcript-meta';
  meta.textContent = `${state.transcriptSegments.length} segments • ${fmtTime(state.videoDuration)} total`;
  bubble.appendChild(meta);

  // Build transcript text with timestamps
  let md = '';
  for (const s of state.transcriptSegments) {
    md += `[${fmtTime(s.start)}] ${s.text}\n\n`;
  }
  const body = document.createElement('div');
  body.innerHTML = renderMarkdown(md);
  bubble.appendChild(body);

  // Insert at top
  chat.insertBefore(bubble, chat.firstChild);
  scrollChatBottom();
}

// ============================================================
// Reactions — text or audio
// Video auto-pauses on Record click
// T = playback time at reaction start
// ============================================================
function getCurrentTimestamp() {
  return video.currentTime || 0;
}

function enableInputs() {
  textInput.disabled = false;
  sendBtn.disabled = false;
  recordBtn.disabled = false;
}

// Text send
sendBtn.addEventListener('click', async () => {
  const text = textInput.value.trim();
  if (!text) return;
  if (state.isLoadingEval) {
    setStatus('Wait for current evaluation to finish', 'error');
    return;
  }
  const T = getCurrentTimestamp();
  // Auto-pause video on reaction
  if (!video.paused && !video.ended) {
    video.pause();
    playPauseBtn.textContent = 'Play';
  }
  textInput.value = '';
  await submitReaction({ type: 'text', text, timestamp: T, source: 'text' });
});

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

// Audio record — MediaRecorder, webm/opus direct to OpenAI
recordBtn.addEventListener('click', async () => {
  if (state.isRecording) {
    stopRecording();
    return;
  }
  if (state.isLoadingEval) {
    setStatus('Wait for current evaluation to finish', 'error');
    return;
  }
  // Auto-pause video on record start
  if (!video.paused && !video.ended) {
    video.pause();
    playPauseBtn.textContent = 'Play';
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.audioChunks = [];
    const mr = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    state.mediaRecorder = mr;
    state.recordingTimestamp = getCurrentTimestamp();
    mr.ondataavailable = e => { if (e.data.size > 0) state.audioChunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
      state.isRecording = false;
      recordBtn.classList.remove('recording');
      recordBtn.innerHTML = '<span class="record-dot"></span>Record';
      setStatus('Transcribing audio via gpt-4o-transcribe...');
      try {
        const result = await transcribeAudio(blob, 'reaction.webm');
        const text = (result.text || '').trim();
        if (!text) {
          setStatus('No speech detected in recording', 'error');
          return;
        }
        // Fill text field for review
        textInput.value = text;
        textInput.focus();
        setStatus('Audio transcribed — review and click Send to submit', 'success');
      } catch (err) {
        setStatus('Audio transcription failed: ' + (err.message || err), 'error');
      }
    };
    mr.start();
    state.isRecording = true;
    recordBtn.classList.add('recording');
    recordBtn.innerHTML = '<span class="record-dot"></span>Stop';
    setStatus('Recording... click Stop when done');
  } catch (err) {
    setStatus('Microphone access failed: ' + (err.message || err), 'error');
  }
});

function stopRecording() {
  if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
    state.mediaRecorder.stop();
  }
}

// ============================================================
// Submit reaction → render user bubble → evaluate → render AI bubble
// ============================================================
async function submitReaction(reaction) {
  const reactionId = 'r' + (state.reactions.length + 1);
  reaction.id = reactionId;
  state.reactions.push(reaction);

  // Render user bubble
  const bubble = document.createElement('div');
  bubble.className = 'bubble user';
  const header = document.createElement('div');
  header.className = 'bubble-header';
  header.innerHTML = `Your reaction <span class="timestamp-tag">T=${fmtTime(reaction.timestamp)}</span>${reaction.type === 'audio' ? ' (audio)' : ''}`;
  bubble.appendChild(header);
  const body = document.createElement('div');
  body.textContent = reaction.text;
  bubble.appendChild(body);
  chat.appendChild(bubble);
  scrollChatBottom();

  // Evaluate
  state.isLoadingEval = true;
  setStatus('Evaluating with gpt-4o...');
  const evalBubble = document.createElement('div');
  evalBubble.className = 'bubble ai loading';
  const evalHeader = document.createElement('div');
  evalHeader.className = 'bubble-header';
  evalHeader.textContent = 'Evaluation';
  evalBubble.appendChild(evalHeader);
  chat.appendChild(evalBubble);
  scrollChatBottom();

  try {
    const evalResult = await evaluateReaction(reaction);
    state.evaluations.push({ reactionId, ...evalResult });
    evalBubble.classList.remove('loading');
    const evalBody = document.createElement('div');
    evalBody.innerHTML = renderMarkdown(evalResult.markdown);
    evalBubble.appendChild(evalBody);
    scrollChatBottom();
    setStatus('Evaluation complete', 'success');
    exportJsonBtn.disabled = false;
    exportMdBtn.disabled = false;
  } catch (err) {
    evalBubble.classList.remove('loading');
    evalBubble.innerHTML = `<div class="bubble-header">Evaluation</div><div style="color:var(--error)">Failed: ${escapeHtml(err.message || String(err))}</div>`;
    scrollChatBottom();
    setStatus('Evaluation failed: ' + (err.message || err), 'error');
  } finally {
    state.isLoadingEval = false;
  }
}

// ============================================================
// Evaluation — gpt-4o, JSON output, 7 dimensions
// ============================================================
async function evaluateReaction(reaction) {
  const key = getApiKey();
  if (!key) throw new Error('API key required');

  // Build transcript slice [0 → T]
  const T = reaction.timestamp;
  const slice = state.transcriptSegments.filter(s => s.start < T);
  let transcriptSliceText = '';
  for (const s of slice) {
    transcriptSliceText += `[${fmtTime(s.start)}] ${s.text}\n`;
  }
  if (!transcriptSliceText) transcriptSliceText = '(no transcript before this timestamp)';

  const systemPrompt = `You are a strict but fair evaluator. You compare a user's reaction against the source transcript to assess accuracy and completeness. Return ONLY valid JSON.`;

  const userPrompt = `Source transcript (segments from start up to timestamp T=${fmtTime(T)}):
---
${transcriptSliceText}
---

User's reaction (at T=${fmtTime(T)}):
---
${reaction.text}
---

Evaluate the user's reaction against the transcript slice above. Score these 7 dimensions on a 0-100 scale (higher is better):

1. accuracy — Does the reaction correctly state what was said in the transcript?
2. understanding — Does the reaction show genuine comprehension, not just repetition?
3. coverage — Does the reaction cover all key points in the transcript slice?
4. unsupported_inference — Does the reaction make claims not supported by the transcript? (Lower score = more unsupported inferences)
5. incorrect_claims — Does the reaction state anything factually wrong vs the transcript? (Lower score = more incorrect claims)
6. missed_points — Does the reaction miss important points from the transcript? (Lower score = more missed points)
7. overall_score — A single overall score summarizing the reaction quality.

Return JSON with this exact structure:
{
  "accuracy": {"score": 0-100, "explanation": "one sentence"},
  "understanding": {"score": 0-100, "explanation": "one sentence"},
  "coverage": {"score": 0-100, "explanation": "one sentence"},
  "unsupported_inference": {"score": 0-100, "explanation": "one sentence"},
  "incorrect_claims": {"score": 0-100, "explanation": "one sentence"},
  "missed_points": {"score": 0-100, "explanation": "one sentence"},
  "overall_score": {"score": 0-100, "explanation": "one sentence"}
}`;

  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${key}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model: 'gpt-4o',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt },
      ],
      response_format: { type: 'json_object' },
      temperature: 0.2,
    }),
  });

  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`OpenAI evaluation ${resp.status}: ${errText}`);
  }
  const data = await resp.json();
  let parsed;
  try {
    parsed = JSON.parse(data.choices[0].message.content);
  } catch (e) {
    throw new Error('Evaluation response was not valid JSON');
  }

  // Build markdown rendering
  const dims = [
    ['accuracy', 'Accuracy'],
    ['understanding', 'Understanding'],
    ['coverage', 'Coverage'],
    ['unsupported_inference', 'Unsupported Inference'],
    ['incorrect_claims', 'Incorrect Claims'],
    ['missed_points', 'Missed Points'],
    ['overall_score', 'Overall Score'],
  ];
  let md = '';
  for (const [key2, label] of dims) {
    const d = parsed[key2];
    if (!d) continue;
    const score = d.score;
    const cls = score >= 80 ? 'high' : score >= 50 ? 'mid' : 'low';
    md += `**${label}** <span class="score-badge ${cls}">${score}/100</span>\n\n${d.explanation || ''}\n\n`;
  }
  return { ...parsed, markdown: md.trim(), transcript_slice: transcriptSliceText };
}

// ============================================================
// Export — JSON and Markdown (in-memory only, refresh clears)
// ============================================================
function buildSessionJson() {
  return {
    exported_at: new Date().toISOString(),
    video: { name: state.videoName, duration: state.videoDuration },
    transcript: state.transcriptSegments,
    reactions: state.reactions,
    evaluations: state.evaluations.map(e => {
      const { markdown, transcript_slice, ...rest } = e;
      return rest;
    }),
  };
}

function buildSessionMarkdown() {
  let md = `# Video Reaction Session\n\n`;
  md += `**Video:** ${state.videoName}\n\n`;
  md += `**Duration:** ${fmtTime(state.videoDuration)}\n\n`;
  md += `**Exported:** ${new Date().toISOString()}\n\n`;
  md += `---\n\n## Transcript\n\n`;
  for (const s of state.transcriptSegments) {
    md += `[${fmtTime(s.start)}] ${s.text}\n\n`;
  }
  md += `---\n\n## Reactions & Evaluations\n\n`;
  for (let i = 0; i < state.reactions.length; i++) {
    const r = state.reactions[i];
    const e = state.evaluations[i];
    md += `### Reaction ${i+1} (T=${fmtTime(r.timestamp)}, ${r.type})\n\n`;
    md += `> ${r.text}\n\n`;
    if (e) {
      md += `**Evaluation:**\n\n`;
      const dims = [
        ['accuracy', 'Accuracy'],
        ['understanding', 'Understanding'],
        ['coverage', 'Coverage'],
        ['unsupported_inference', 'Unsupported Inference'],
        ['incorrect_claims', 'Incorrect Claims'],
        ['missed_points', 'Missed Points'],
        ['overall_score', 'Overall Score'],
      ];
      for (const [k, label] of dims) {
        if (e[k]) md += `- **${label}:** ${e[k].score}/100 — ${e[k].explanation || ''}\n`;
      }
      md += `\n`;
    }
    md += `---\n\n`;
  }
  return md;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

exportJsonBtn.addEventListener('click', () => {
  if (!state.transcriptSegments.length) return;
  const json = JSON.stringify(buildSessionJson(), null, 2);
  downloadBlob(new Blob([json], { type: 'application/json' }), `session-${Date.now()}.json`);
});

exportMdBtn.addEventListener('click', () => {
  if (!state.transcriptSegments.length) return;
  const md = buildSessionMarkdown();
  downloadBlob(new Blob([md], { type: 'text/markdown' }), `session-${Date.now()}.md`);
});

// ============================================================
// API key handling (in-memory only)
// ============================================================
apiKeyInput.addEventListener('input', () => {
  state.apiKey = apiKeyInput.value.trim();
  setApiError('');
});
</script>
